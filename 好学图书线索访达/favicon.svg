<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 蓝色背景 -->
  <rect width="200" height="200" fill="#3B8AE8"/>

  <!-- ===== 翻开的书 ===== -->
  <!-- 左侧外封面竖块 -->
  <rect x="7" y="112" width="22" height="68" rx="6" fill="white"/>
  <!-- 右侧外封面竖块 -->
  <rect x="171" y="112" width="22" height="68" rx="6" fill="white"/>

  <!-- 左页面展开（从书脊向左上弧形散开） -->
  <path d="M7 120 C7 120 30 112 100 104 L100 170 C30 178 7 180 7 180 Z" fill="white"/>
  <!-- 右页面展开 -->
  <path d="M193 120 C193 120 170 112 100 104 L100 170 C170 178 193 180 193 180 Z" fill="white"/>

  <!-- 左页深度纹路线 1 -->
  <path d="M20 133 Q60 125 100 122" stroke="#3B8AE8" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <!-- 左页深度纹路线 2 -->
  <path d="M20 152 Q60 144 100 141" stroke="#3B8AE8" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 右页深度纹路线 1 -->
  <path d="M180 133 Q140 125 100 122" stroke="#3B8AE8" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <!-- 右页深度纹路线 2 -->
  <path d="M180 152 Q140 144 100 141" stroke="#3B8AE8" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 书脊中缝（中央向下弯曲） -->
  <path d="M100 104 C97 136 100 170" stroke="#3B8AE8" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 右侧书签小竖条 -->
  <rect x="149" y="102" width="13" height="52" rx="3.5" fill="white"/>

  <!-- ===== 毕业帽 ===== -->
  <!-- 帽冠主体（圆柱/台形体） -->
  <path d="M58 72 L58 108 Q100 96 142 108 L142 72 Q100 60 58 72 Z" fill="white"/>

  <!-- 毕业帽顶板（大菱形，两侧延伸远） -->
  <polygon points="100,16 190,58 100,100 10,58" fill="white"/>

  <!-- 帽顶小圆钮 -->
  <circle cx="100" cy="16" r="7" fill="#3B8AE8"/>

  <!-- 流苏细绳 -->
  <path d="M28 58 Q24 80 22 102" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- 流苏末端水滴 -->
  <ellipse cx="22" cy="112" rx="7" ry="10" fill="white"/>
</svg>
